<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Translator</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1>GitHub 翻译器</h1>
      <p class="status">模块名、按钮和状态词使用本地词典；README、Issue、PR 和评论正文默认使用 LM Studio 本地 AI 翻译。</p>

      <label class="field checkbox-field">
        <input id="enabled" type="checkbox" />
        <span>启用 GitHub 界面翻译</span>
      </label>

      <label class="field">
        <span>API Base URL</span>
        <input id="apiBaseUrl" type="text" placeholder="默认 http://127.0.0.1:1234/v1" />
      </label>

      <label class="field">
        <span>API Key（可选）</span>
        <input id="apiKey" type="password" placeholder="LM Studio 本地接口可留空" />
      </label>

      <label class="field">
        <span>Model</span>
        <input id="model" type="text" placeholder="例如 qwen2.5-1.5b-instruct" />
      </label>

      <div class="actions">
        <button id="saveButton" class="primary">保存设置</button>
        <button id="refreshButton">立即应用界面翻译</button>
        <button id="translateButton">AI 翻译 README / 正文</button>
        <button id="restoreButton">恢复页面</button>
      </div>

      <p id="runtimeStatus" class="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
