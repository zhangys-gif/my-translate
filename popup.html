<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub Translator</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1>GitHub 翻译器</h1>
      <p class="status">当前版本为纯本地词典翻译，不调用任何 AI 接口。</p>

      <label class="field checkbox-field">
        <input id="enabled" type="checkbox" />
        <span>启用 GitHub 界面翻译</span>
      </label>

      <div class="actions">
        <button id="saveButton" class="primary">保存设置</button>
        <button id="refreshButton">立即应用到当前页</button>
        <button id="restoreButton">恢复页面</button>
      </div>

      <p id="runtimeStatus" class="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
